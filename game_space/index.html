
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Shooter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>🚀 GALAXY <span>SHOOTER</span></h1>
        <p class="subtitulo">Destrua os inimigos e faça a maior pontuação!</p>

        <div class="painel">
            <div>PONTOS <strong id="pontos">0</strong></div>
            <div>VIDAS <strong id="vidas">3</strong></div>
        </div>

        <div class="area-jogo">
            <canvas id="jogo" width="400" height="600"></canvas>

            <div class="tela" id="tela">
                <h2 id="titulo">GALAXY SHOOTER</h2>
                <p id="mensagem">Prepare-se para defender a galáxia!</p>
                <button id="iniciar">INICIAR JOGO</button>
            </div>
        </div>

        <div class="controles">
            <button id="esquerda" aria-label="Mover para esquerda">◀</button>
            <button id="atirar" aria-label="Atirar">🔥 ATIRAR</button>
            <button id="direita" aria-label="Mover para direita">▶</button>
        </div>

        <p class="instrucoes">
            PC: setas ou A/D para mover e espaço para atirar.<br>
            Celular: use os botões na tela.
        </p>
    </main>
</body>
</html>
